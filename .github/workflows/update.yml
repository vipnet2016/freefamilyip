name: Update Subscriptions

on:
  schedule:
    # 每天在 UTC 时间 0:00, 6:00, 12:00, 18:00 自动触发更新
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持手动点击运行

concurrency:
  group: update-subscriptions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (with retries)
        env:
          MAX_ATTEMPTS: 3
        run: |
          set -euo pipefail
          n=0
          until [ "$n" -ge "$MAX_ATTEMPTS" ]; do
            echo "[*] 运行 scripts/main.py (尝试 $((n+1))/$MAX_ATTEMPTS)"
            if python scripts/main.py; then
              echo "[+] scripts/main.py 成功"
              break
            fi
            n=$((n+1))
            echo "[!] scripts/main.py 运行失败，准备重试 $n/$MAX_ATTEMPTS"
            sleep $((n * 15))
          done
          if [ "$n" -ge "$MAX_ATTEMPTS" ]; then
            echo "[ERROR] scripts/main.py 在 $MAX_ATTEMPTS 次尝试后仍然失败"
            exit 1
          fi

      - name: Commit and Push Results (safe pull/rebase)
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"

          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ -z "$BRANCH" ]; then
            BRANCH="main"
          fi
          echo "[*] 目标分支: $BRANCH"

          git fetch origin "$BRANCH" --quiet
          if ! git pull --rebase=merges --autostash origin "$BRANCH"; then
            echo "[ERROR] git pull --rebase 失败，可能存在冲突或远端变更需要人工处理."
            git rebase --abort || true
            exit 1
          fi

          git add -A output/ README.md || true

          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
            exit 0
          fi

          git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC" || true

          if ! git push origin "HEAD:${BRANCH}"; then
            echo "[ERROR] git push 被拒绝，远端可能已在此期间有新提交。请检查仓库合并策略。"
            exit 1
          fi
